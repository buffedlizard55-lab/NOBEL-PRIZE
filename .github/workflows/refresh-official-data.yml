name: Refresh official Nobel data

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d0d5-nobel-prize
    paths-ignore:
      - "data/**"

permissions:
  contents: write

concurrency:
  group: refresh-official-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official sources and build the catalog
        run: |
          python scripts/fetch_official.py
          python scripts/build_catalog.py
          python scripts/verify_catalog.py || echo "Verification reported integrity problems. Data is still committed so the disagreements can be reviewed."

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh official Nobel Prize records"
            git push
          fi
